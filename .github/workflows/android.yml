
name: Build Zayn AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q ./*.zip -d "$RUNNER_TEMP/source"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          GRADLE_FILE=$(find "$RUNNER_TEMP/source" -name gradlew -type f | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle wrapper tidak ditemukan"
            exit 1
          fi
          cd "$(dirname "$GRADLE_FILE")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZaynAI-APK
          path: ${{ runner.temp }}/source/**/build/outputs/apk/debug/*.apk
